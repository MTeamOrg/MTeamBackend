name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mteam
          POSTGRES_PASSWORD: mteam_test_password
          POSTGRES_DB: mteam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mteam -d mteam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://mteam:mteam_test_password@localhost:5432/mteam_test
      DIRECT_URL: postgresql://mteam:mteam_test_password@localhost:5432/mteam_test
      NOTIFICATION_TEST_DATABASE_URL: postgresql://mteam:mteam_test_password@localhost:5432/mteam_test
      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN: 3600
      CORS_ORIGIN: http://localhost:5173
      QASE_MODE: ${{ secrets.QASE_TESTOPS_API_TOKEN != '' && vars.QASE_TESTOPS_PROJECT != '' && 'testops' || 'off' }}
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
      QASE_TESTOPS_PROJECT: ${{ vars.QASE_TESTOPS_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm rebuild @prisma/engines prisma bcrypt @swc/core esbuild
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run prisma:migrate:deploy
      - name: PostgreSQL integration tests
        run: npm run test:integration:notifications
        env:
          QASE_TESTOPS_RUN_TITLE: Backend - PostgreSQL integration - notifications
      - name: Unit and API tests
        run: npm test
        env:
          QASE_TESTOPS_RUN_TITLE: Backend - unit and API
      - run: npm run build
      - run: npm run openapi:validate
