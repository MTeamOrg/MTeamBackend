name: SonarQube
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://mteam:mteam_test_password@localhost:5432/mteam_test
      DIRECT_URL: postgresql://mteam:mteam_test_password@localhost:5432/mteam_test
      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN: 3600
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate backend test coverage
        working-directory: backend
        run: npm run test:coverage
      - name: Verify coverage report
        run: |
          test -s backend/coverage/lcov.info
          grep -q '^SF:backend/src/' backend/coverage/lcov.info
          awk '
            /^SF:/ { isRecoveryService = ($0 == "SF:backend/src/service/recovery-email-service.ts") }
            isRecoveryService && /^DA:/ {
              split(substr($0, 4), lineCoverage, ",")
              if (lineCoverage[2] > 0) hasExecutedLine = 1
            }
            END { exit !hasExecutedLine }
          ' backend/coverage/lcov.info
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mteamorg
            -Dsonar.projectKey=MTeamOrg_MTeamBackend
            -Dsonar.sources=backend/src
            -Dsonar.tests=backend/test
            -Dsonar.exclusions=backend/src/generated/**,backend/src/**/*.d.ts
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
