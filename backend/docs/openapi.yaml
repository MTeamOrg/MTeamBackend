      properties:
        user: { $ref: "#/components/schemas/UserResponse" }
        memberProfile:
          oneOf:
            - $ref: "#/components/schemas/MemberProfileResponse"
            - type: "null"
        trainerProfile:
          oneOf:
            - $ref: "#/components/schemas/TrainerProfileResponse"
            - type: "null"
      example:
        user:
          id: 11111111-1111-4111-8111-111111111111
          firstName: Martina
          lastName: Pérez
          documentNumber: "40111222"
          birthDate: "1998-04-12"
          email: martina.perez@example.com
          phone: "+54 11 5555-0101"
          photoUrl: null
          role: MEMBER
          status: ACTIVE
          isPasswordChangeRequired: false
          createdAt: "2026-08-01T10:00:00-03:00"
          updatedAt: "2026-09-10T18:30:00-03:00"
        memberProfile:
          id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
          emergencyContactName: Juan Pérez
          emergencyContactPhone: "+54 11 5555-0102"
          membership:
            status: CURRENT
            canEnter: true
            currentPrice: 45000.0
            lastAccreditedAt: "2026-09-01T12:00:00-03:00"
            expiresAt: "2026-10-01T12:00:00-03:00"
            remainingDays: 17
            initialMedicalGraceEndsAt: "2026-09-21T12:00:00-03:00"
            initialMedicalGraceRemainingDays: 7
            medicalCertificateStatus: PENDING
        trainerProfile: null
    UserPageResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/UserResponse" } }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
      example:
        items:
          - id: 11111111-1111-4111-8111-111111111111
            firstName: Martina
            lastName: Pérez
            documentNumber: "40111222"
            birthDate: "1998-04-12"
            email: martina.perez@example.com
            phone: "+54 11 5555-0101"
            photoUrl: null
            role: MEMBER
            status: ACTIVE
            isPasswordChangeRequired: false
            createdAt: "2026-08-01T10:00:00-03:00"
            updatedAt: "2026-09-10T18:30:00-03:00"
        pagination: { page: 1, limit: 20, total: 1, totalPages: 1 }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, documentNumber, birthDate, email, phone, temporaryPassword, role]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        documentNumber: { type: string, minLength: 1 }
        birthDate: { type: string, format: date }
        email: { type: string, format: email }
        phone: { type: string, minLength: 1 }
        temporaryPassword: { type: string, format: password, minLength: 8, writeOnly: true }
        role: { $ref: "#/components/schemas/UserRole" }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        specialty: { type: string }
        description: { type: string }
      example:
        firstName: Laura
        lastName: Benítez
