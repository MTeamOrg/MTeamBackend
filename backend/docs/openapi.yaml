      tags: [Scheduled Classes]
      summary: Consultar una clase
      operationId: getScheduledClass
      security: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
    patch:
      tags: [Scheduled Classes]
      summary: Modificar una clase
      description: >-
        Exclusivo de administradores. La clase permanece en su semana original;
        startsAt debe seguir dentro de ella. Se permite quitar el entrenador con
        trainerId null. No se modifican clases que ya comenzaron.
      operationId: updateScheduledClass
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateScheduledClassRequest" }
      responses:
        "200":
          description: Clase modificada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedScheduledClass" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Scheduled Classes]
      summary: Quitar una clase del cronograma
      description: >-
        Exclusivo de administradores. Quita una clase que todavía no comenzó;
        conserva el cronograma semanal y las clases históricas.
      operationId: deleteScheduledClass
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

