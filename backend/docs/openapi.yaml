      summary: Consultar el cronograma de una semana
      description: >-
        Consulta pública. weekStartsOn debe ser un lunes de
        America/Argentina/Buenos_Aires. Si todavía no hay clases para esa
        semana, devuelve el cronograma con classes vacío.
      operationId: listWeeklySchedules
      security: []
      parameters:
        - name: weekStartsOn
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Cronograma semanal y sus clases ordenadas por fecha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklySchedule" }
