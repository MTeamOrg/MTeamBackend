components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Enviar Authorization: Bearer <JWT>. La API verifica la firma HS256 y la
        expiración, y consulta en cada solicitud privada el usuario actual.
        El usuario debe existir y estar ACTIVE. Los permisos se evalúan con su
        rol actual en la base de datos, no con el rol incluido en el JWT.

  parameters:
    Search:
      name: search
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    MemberId: { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentId: { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    CertificateId: { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
    AttemptId: { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    AccessPointId: { name: accessPointId, in: path, required: true, schema: { type: string, format: uuid } }
    BranchId: { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
    ScheduleId: { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassId: { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
    TrainerId: { name: trainerId, in: path, required: true, schema: { type: string, format: uuid } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    NewsPostId: { name: newsPostId, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    GenericJson:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }

  responses:
    Success:
      description: Operación exitosa
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Created:
      description: Recurso creado
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    NoContent:
      description: Operación completada sin contenido
    Paginated:
      description: Resultado paginado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PaginatedResponse" }
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Bearer ausente o mal formado, JWT inválido o vencido, o usuario inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: UNAUTHORIZED
            message: Se requiere una autenticación válida
            details: null
    Forbidden:
      description: Cuenta inactiva, cambio de contraseña pendiente o rol actual sin permisos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            insufficientRole:
              value:
                code: FORBIDDEN
                message: No tiene permisos para realizar esta operación
                details: null
            inactiveAccount:
              value:
                code: ACCOUNT_INACTIVE
                message: La cuenta se encuentra inactiva
                details: null
            passwordChangeRequired:
              value:
                code: PASSWORD_CHANGE_REQUIRED
                message: Debe cambiar la contraseña temporal antes de continuar
                details: null
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: La operación entra en conflicto con el estado actual
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthResponse:
      type: object
      required: [status, environment]
      properties:
        status: { type: string, const: ok }
        environment: { type: string, examples: [development] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        message: { type: string }
        code: { type: string }
        details: { type: [object, "null"], additionalProperties: true }
    PaginatedResponse:
      type: object
      required: [items, page, limit, total]
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    UserRole:
      type: string
