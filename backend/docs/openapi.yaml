openapi: 3.1.0
info:
  title: M-Team API
  version: 0.2.0
  description: |
    Contrato de la API REST de M-Team para la gestión del gimnasio.

    El prefijo `/api` está definido en `servers`; no debe repetirse en `paths`.
    Swagger UI se publica en `/api/docs` y el documento JSON en
    `/api/docs/openapi.json`.

    Cada operación declara `x-implementation-status`:

    - `implemented-verified`: existe en Express y fue cubierta por una prueba.
    - `implemented-unverified`: existe en Express, pero no pudo comprobarse.
    - `pending`: es un contrato acordado todavía sin ruta funcional. En estas
      operaciones, **Try it out responderá 404** hasta que se implemente el módulo.

    Los roles funcionales confirmados por el alcance vigente son `MEMBER`,
    `TRAINER` y `ADMIN`. El rol recepcionista no está modelado y no se incorpora
    silenciosamente a este contrato.
  contact:
    name: Equipo M-Team
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local con datos ficticios
tags:
  - { name: System, description: "Estado técnico y publicación del contrato." }
  - { name: Authentication, description: "Registro, autenticación e identidad de sesión." }
  - { name: Dashboard, description: "Indicadores del panel administrativo." }
  - { name: Users, description: "Perfiles, cuentas, estados y auditoría." }
  - { name: Members, description: "Estado administrativo de socios." }
  - { name: Membership Prices, description: "Precio único e historial de la cuota mensual." }
  - { name: Payments, description: "Acreditación manual, consulta y anulación de pagos." }
  - { name: Medical Certificates, description: "Carga, consulta y revisión de aptos médicos." }
  - { name: Access Attempts, description: "Validación de ingreso y registros resultantes." }
  - { name: Access Points, description: "Puntos físicos identificados por QR fijo." }
  - { name: Branches, description: "Sedes y sus datos públicos y administrativos." }
  - { name: Weekly Schedules, description: "Semanas que agrupan el cronograma informativo." }
  - { name: Scheduled Classes, description: "Clases informativas sin reservas ni asistencia." }
  - { name: Trainers, description: "Perfiles y clases asignadas a entrenadores." }
  - { name: Events, description: "Eventos vinculados a una sede." }
  - { name: News Posts, description: "Novedades segmentadas por audiencia." }
  - { name: Notifications, description: "Notificaciones internas del usuario autenticado." }
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Verificar el estado de la API
      description: Devuelve el estado del proceso y el ambiente lógico configurado.
      x-implementation-status: implemented-verified
      security: []
      responses:
        "200":
          description: API disponible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  /docs/openapi.json:
    get:
      tags: [System]
      operationId: getOpenApiDocument
      summary: Obtener el contrato OpenAPI utilizado por Swagger UI
      description: Devuelve exactamente el documento cargado por Swagger UI.
      x-implementation-status: implemented-verified
      security: []
      responses:
        "200":
          description: Documento OpenAPI vigente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenApiDocumentResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerMember
      summary: Registrar una cuenta de socio
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Crea siempre un usuario `MEMBER` activo y valida que
        documento y correo normalizado no estén registrados.
      x-implementation-status: pending
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterMemberRequest" }
      responses:
        "201":
          description: Socio registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Iniciar sesión
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Valida credenciales y cuenta activa sin revelar si el
        correo existe. No se define refresh token.
      x-implementation-status: pending
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Listar y filtrar usuarios
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. La búsqueda administrativa contempla nombre, apellido,
        documento y correo.
      x-implementation-status: pending
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/UserRoleFilter"
        - $ref: "#/components/parameters/UserStatusFilter"
      responses:
        "200":
          description: Página de usuarios.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Crear una cuenta desde administración
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Permite crear `MEMBER`, `TRAINER` o `ADMIN`; los datos de
        perfil dependen del rol elegido.
      x-implementation-status: pending
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Usuario creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetailResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/me:
    get:
      tags: [Users]
      operationId: getOwnProfile
      summary: Consultar el perfil propio
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Solo permite consultar el registro asociado a la sesión.
      x-implementation-status: pending
      x-roles: [MEMBER, TRAINER, ADMIN]
      responses:
        "200":
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Users]
      operationId: updateOwnProfile
      summary: Modificar los datos permitidos del perfil propio
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Solo actualiza correo, teléfono y contacto de emergencia;
        no admite documento, rol ni estado.
      x-implementation-status: pending
      x-roles: [MEMBER, TRAINER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOwnProfileRequest" }
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetailResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/me/photo:
    put:
      tags: [Users]
      operationId: replaceOwnPhoto
      summary: Reemplazar la fotografía del perfil propio
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. El multipart proviene del contrato existente y de la
        arquitectura de Storage; el límite máximo sigue sin definirse.
      x-implementation-status: pending
      x-roles: [MEMBER, TRAINER, ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ProfilePhotoUploadRequest" }
      responses:
        "200":
          description: Perfil con la fotografía actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: Consultar el detalle administrativo de un usuario
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. El detalle compone perfil y resumen según el rol.
      x-implementation-status: pending
      x-roles: [ADMIN]
      responses:
        "200":
          description: Detalle administrativo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Modificar un usuario desde administración
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Estado y contraseña usan operaciones separadas y auditables.
      x-implementation-status: pending
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Usuario actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetailResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{userId}/status:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Users]
      operationId: updateUserStatus
      summary: Activar, desactivar o reactivar una cuenta
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Conserva el historial y no modifica cuota ni apto médico.
      x-implementation-status: pending
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserStatusRequest" }
      responses:
        "200":
          description: Estado actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{userId}/password-resets:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      operationId: assignTemporaryPassword
      summary: Asignar una contraseña temporal
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Obliga a cambiarla en el próximo inicio y no envía correos.
      x-implementation-status: pending
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemporaryPasswordRequest" }
      responses:
        "204": { description: Contraseña temporal asignada; no devuelve contenido. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{userId}/audit-logs:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: listUserAuditLogs
      summary: Consultar el historial administrativo de una cuenta
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Es de solo lectura y muestra responsable, acción y fecha.
      x-implementation-status: pending
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de eventos de auditoría.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAuditLogPageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: Listar socios y filtrar por estado de cuota
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Los estados de cuota se calculan; no se almacenan.
      x-implementation-status: pending
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MembershipStatusFilter"
      responses:
        "200":
          description: Página de socios.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /members/me/membership:
    get:
      tags: [Members]
      operationId: getOwnMembership
      summary: Consultar el estado de la cuota propia
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Solo devuelve la situación del socio autenticado y aplica
        30 días por pago sin acumular vigencias.
      x-implementation-status: pending
      x-roles: [MEMBER]
      responses:
        "200":
          description: Situación de cuota del socio autenticado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipSummaryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /membership-prices/current:
    get:
      tags: [Membership Prices]
      operationId: getCurrentMembershipPrice
      summary: Consultar el valor vigente de la cuota
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Devuelve el único precio con vigencia más reciente.
      x-implementation-status: pending
      x-roles: [MEMBER, ADMIN]
      responses:
        "200":
          description: Precio vigente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPriceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /membership-prices:
    get:
      tags: [Membership Prices]
      operationId: listMembershipPrices
      summary: Consultar el historial de valores de cuota
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Conserva importes, vigencia y administrador responsable.
      x-implementation-status: pending
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de precios históricos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPricePageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Membership Prices]
      operationId: createMembershipPrice
      summary: Registrar un nuevo valor de cuota
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Crea una vigencia nueva sin modificar pagos anteriores y
        genera las notificaciones internas acordadas.
      x-implementation-status: pending
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMembershipPriceRequest" }
      responses:
        "201":
          description: Precio registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPriceResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: Buscar y filtrar pagos
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Filtra acreditaciones manuales y anulaciones conservadas.
      x-implementation-status: pending
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/FromDateTime"
        - $ref: "#/components/parameters/ToDateTime"
        - $ref: "#/components/parameters/MemberIdFilter"
        - $ref: "#/components/parameters/DocumentNumberFilter"
        - $ref: "#/components/parameters/PaymentMethodFilter"
        - $ref: "#/components/parameters/PaymentStatusFilter"
      responses:
        "200":
          description: Página de pagos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Registrar y acreditar manualmente un pago
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. El pago nace `ACCREDITED`, inicia 30 días desde
        `accreditedAt` y no se asocia directamente con `MembershipPrice`.
      x-implementation-status: pending
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Pago acreditado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /payments/previews:
    post:
      tags: [Payments]
      operationId: previewPayment
      summary: Calcular un resumen previo sin crear el pago
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Calcula el vencimiento esperado y no persiste información.
      x-implementation-status: pending
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentPreviewRequest" }
      responses:
        "200":
          description: Resumen previo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPreviewResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /payments/summary:
    get:
      tags: [Payments]
      operationId: getPaymentsSummary
      summary: Calcular el total acreditado dentro de un período
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Suma solamente pagos `ACCREDITED` y excluye anulados.
      x-implementation-status: pending
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/RequiredFromDateTime"
        - $ref: "#/components/parameters/RequiredToDateTime"
      responses:
        "200":
          description: Total del período.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentsSummaryResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Consultar un pago
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Incluye la trazabilidad de creación, confirmación y anulación.
      x-implementation-status: pending
      x-roles: [ADMIN]
      responses:
        "200":
          description: Pago encontrado.
          content:
            application/json:
