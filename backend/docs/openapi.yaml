openapi: 3.1.0
info:
  title: M-Team API
  version: 0.1.0
  description: |
    Contrato inicial de la API REST de M-Team. La API administra usuarios,
    cuota mensual, pagos, aptos médicos, accesos QR, sedes, clases,
    entrenadores, eventos, novedades y notificaciones.
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
tags:
  - name: System
  - name: Authentication
  - name: Dashboard
  - name: Users
  - name: Members
  - name: Membership Prices
  - name: Payments
  - name: Medical Certificates
  - name: Access Attempts
  - name: Access Points
  - name: Branches
  - name: Weekly Schedules
  - name: Scheduled Classes
  - name: Trainers
  - name: Events
  - name: News Posts
  - name: Notifications
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Verificar el estado de la API
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/register:
    post:
      tags: [Authentication]
      summary: Registrar una cuenta de socio
      operationId: registerMember
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Cuenta de socio registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: socio@example.com
              password: example-password-only
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Cuerpo de inicio de sesión inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: VALIDATION_ERROR
                message: Los datos de inicio de sesión no son válidos
                details: { formErrors: [], fieldErrors: { email: [Correo inválido] } }
        "401":
          description: El correo inexistente y la contraseña incorrecta producen el mismo error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: INVALID_CREDENTIALS
                message: Correo electrónico o contraseña incorrectos
                details: null
        "403":
          description: Cuenta inactiva con credenciales válidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: ACCOUNT_INACTIVE
                message: La cuenta se encuentra inactiva
                details: null

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Cerrar sesión
      description: >-
        Valida la sesión actual y finaliza la operación sin contenido. Como
        la API utiliza JWT sin sesiones persistentes, el frontend debe eliminar
        el token almacenado y redirigir al formulario de ingreso.
      operationId: logout
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Obtener la identidad autenticada
      operationId: getCurrentIdentity
      responses:
        "200":
          description: Identidad autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/password:
    patch:
      tags: [Authentication]
      summary: Cambiar la contraseña propia
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400":
          description: Datos inválidos, contraseña actual incorrecta o reutilización de contraseña
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                validationError:
                  summary: Cuerpo inválido
                  value:
                    code: VALIDATION_ERROR
                    message: Los datos para cambiar la contraseña no son válidos
                    details: { formErrors: [], fieldErrors: { newPassword: [La contraseña debe tener al menos 8 caracteres] } }
                invalidCurrentPassword:
                  summary: Contraseña actual incorrecta
                  value:
                    code: INVALID_CURRENT_PASSWORD
                    message: La contraseña actual es incorrecta
                    details: null
                passwordReuse:
                  summary: Reutilización de la contraseña actual
                  value:
                    code: PASSWORD_REUSE
                    message: La contraseña nueva debe ser diferente de la actual
                    details: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Obtener el panel correspondiente al rol autenticado
      operationId: getDashboard
      responses:
        "200": { $ref: "#/components/responses/Success" }

  /users:
    get:
      tags: [Users]
      summary: Listar y filtrar usuarios
      description: >-
        Operación exclusiva de administradores. Permite buscar por nombre,
        apellido, documento o correo, y filtrar por rol o estado.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/UserRole" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
      responses:
        "200":
          description: Listado paginado de usuarios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      summary: Crear una cuenta desde administración
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/me:
    get:
      tags: [Users]
      summary: Consultar el perfil propio
      operationId: getOwnProfile
      responses:
        "200":
          description: Perfil actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Users]
      summary: Modificar los datos permitidos del perfil propio
      operationId: updateOwnProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/me/photo:
    put:
      tags: [Users]
      summary: Reemplazar la fotografía del perfil propio
      operationId: updateOwnPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Fotografía JPG o PNG de hasta 5 MB.
      responses:
        "200":
          description: Perfil actualizado con la URL de la fotografía
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Fallo del servicio de almacenamiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Almacenamiento no configurado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Consultar el detalle administrativo de un usuario
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Detalle administrativo del usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      summary: Modificar un usuario desde administración
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Usuario modificado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/status:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Users]
      summary: Activar, desactivar o reactivar una cuenta
      description: >-
        Operación exclusiva de administradores. Sólo modifica el estado de la
        cuenta y conserva pagos, aptos, accesos, clases y demás historial. La
        interfaz debe solicitar confirmación antes de enviar la operación.
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserStatusRequest" }
      responses:
        "200":
          description: Usuario con el nuevo estado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserListItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/password-resets:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      summary: Asignar una contraseña temporal
      description: >-
        Operación exclusiva de administradores. Reemplaza la contraseña por
        un valor temporal y obliga al usuario a cambiarla antes de acceder a
        cualquier otra ruta privada.
      operationId: resetUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/audit-logs:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Consultar el historial administrativo de una cuenta
      operationId: listUserAuditLogs
      description: Sólo lectura. Incluye la acción, el motivo, la fecha y el administrador responsable.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Historial paginado de la cuenta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAuditLogResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /members:
    get:
      tags: [Members]
      summary: Listar socios y filtrar por estado de cuota
      description: >-
        Exclusivo de administradores. El estado de cuota se calcula desde el
        último pago acreditado válido; el filtro se aplica antes de paginar.
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: membershipStatus
          in: query
          schema: { $ref: "#/components/schemas/MembershipStatus" }
      responses:
        "200":
          description: Listado paginado de socios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /members/me/membership:
    get:
      tags: [Members]
      summary: Consultar el estado de la cuota propia
      operationId: getOwnMembership
      responses:
        "200": { $ref: "#/components/responses/Success" }

  /membership-prices/current:
    get:
      tags: [Membership Prices]
      summary: Consultar el valor vigente de la cuota
      operationId: getCurrentMembershipPrice
      responses:
        "200": { $ref: "#/components/responses/Success" }

  /membership-prices:
    get:
      tags: [Membership Prices]
      summary: Consultar el historial de valores de cuota (administradores)
      operationId: listMembershipPrices
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Historial paginado de valores de cuota
          content:
            application/json:
              schema:
                type: object
                required: [items, page, limit, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MembershipPriceHistoryItem" }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Membership Prices]
      summary: Registrar un nuevo valor de cuota
      operationId: createMembershipPrice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMembershipPriceRequest" }
      responses:
        "201":
          description: Nuevo valor de cuota registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPriceHistoryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /payments:
    get:
      tags: [Payments]
      summary: Buscar y filtrar pagos
      description: >-
        Exclusivo de administradores. Los filtros se combinan y se aplican antes
        de paginar. El documento admite coincidencias parciales y el medio es exacto.
        Las fechas corresponden a accreditedAt, con from inclusivo y to exclusivo.
        Incluye pagos acreditados y anulados.
      operationId: listPayments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: memberId
          in: query
          schema: { type: string, format: uuid }
        - name: documentNumber
          in: query
          schema: { type: string }
        - name: method
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
      responses:
        "200":
          description: Pagos filtrados y paginados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentReportResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Payments]
      summary: Registrar y acreditar un pago
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }

  /payments/previews:
    post:
      tags: [Payments]
      summary: Calcular un resumen previo sin crear el pago
      description: >-
        Operación exclusiva de administradores. El vencimiento estimado se calcula
        al solicitar la vista previa; la acreditación vuelve a calcular su fecha efectiva.
      operationId: previewPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentPreviewRequest" }
      responses:
        "200":
          description: Resumen estimado sin registrar el pago
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPreviewResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payments/summary:
    get:
      tags: [Payments]
      summary: Calcular el total acreditado dentro de un período
      description: >-
        Exclusivo de administradores. Usa accreditedAt con from inclusivo y to
        exclusivo. Suma todos los pagos que sigan ACCREDITED en el período,
        independientemente de la paginación del listado.
      operationId: getPaymentsSummary
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Total de pagos acreditados del período
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSummaryResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      tags: [Payments]
      summary: Consultar un pago
      operationId: getPayment
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payments/{paymentId}/voids:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [Payments]
      summary: Anular un pago acreditado
      description: Operación exclusiva de administradores. Conserva el pago y registra la anulación.
      operationId: voidPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoidPaymentRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /members/me/payments:
    get:
      tags: [Payments]
      summary: Consultar el historial de pagos propio
      description: Exclusivo de socios autenticados; incluye pagos acreditados y anulados.
      operationId: listOwnPayments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Historial paginado de pagos propios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentHistoryResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /members/{memberId}/payments:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      tags: [Payments]
      summary: Consultar los pagos de un socio
      description: Exclusivo de administradores; incluye pagos acreditados y anulados.
      operationId: listMemberPayments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Historial paginado de pagos del socio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentHistoryResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /members/me/medical-certificates:
    get:
      tags: [Medical Certificates]
      summary: Consultar el historial propio de aptos médicos
      operationId: listOwnMedicalCertificates
      responses:
        "200": { $ref: "#/components/responses/Paginated" }
    post:
      tags: [Medical Certificates]
      summary: Cargar un apto médico
      operationId: uploadMedicalCertificate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /medical-certificates:
    get:
      tags: [Medical Certificates]
      summary: Buscar y filtrar aptos médicos
      operationId: listMedicalCertificates
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MedicalCertificateStatus" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200": { $ref: "#/components/responses/Paginated" }

  /medical-certificates/{certificateId}:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    get:
      tags: [Medical Certificates]
      summary: Consultar el detalle de un apto médico
      operationId: getMedicalCertificate
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }

