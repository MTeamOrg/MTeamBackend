          status: CURRENT
          canEnter: true
          currentPrice: 45000.0
          lastAccreditedAt: "2026-09-01T12:00:00-03:00"
          expiresAt: "2026-10-01T12:00:00-03:00"
          remainingDays: 17
          initialMedicalGraceEndsAt: "2026-09-21T12:00:00-03:00"
          initialMedicalGraceRemainingDays: 7
          medicalCertificateStatus: PENDING
    TrainerProfileResponse:
      type: object
      additionalProperties: false
      required: [id, specialty, description, branches]
      properties:
        id: { type: string, format: uuid }
        specialty: { type: string }
        description: { type: string }
        branches:
          type: array
          items: { $ref: "#/components/schemas/BranchSummary" }
      example:
        id: ffffffff-ffff-4fff-8fff-ffffffffffff
        specialty: Entrenamiento funcional
        description: Entrenadora con experiencia en clases grupales.
        branches:
          - id: 22222222-2222-4222-8222-222222222222
            name: M-Team Centro
            address: Avenida Ejemplo 123, CABA
            isActive: true
    UserDetailResponse:
      type: object
      additionalProperties: false
