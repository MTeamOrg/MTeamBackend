              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentIdentity
      summary: Obtener la identidad autenticada
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Devuelve identidad y rol, nunca contraseña ni hash.
      x-implementation-status: pending
      x-roles: [MEMBER, TRAINER, ADMIN]
      responses:
        "200":
          description: Identidad autenticada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentIdentityResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/password:
    patch:
      tags: [Authentication]
      operationId: changeOwnPassword
      summary: Cambiar la contraseña propia
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Requiere la contraseña actual y elimina la obligación de
        cambio cuando se utilizó una contraseña temporal.
      x-implementation-status: pending
      x-roles: [MEMBER, TRAINER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Contraseña actualizada; no devuelve contenido. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getAdminDashboard
      summary: Obtener indicadores del panel administrativo
      description: |
        **CONTRATO PENDIENTE:** todavía no existe la ruta Express; **Try it out**
        responderá 404. Compone indicadores calculados, cronogramas y accesos
        recientes; no persiste una entidad dashboard.
      x-implementation-status: pending
      x-roles: [ADMIN]
      responses:
        "200":
          description: Resumen administrativo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboardResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT acordado por arquitectura; autenticación todavía pendiente.

  parameters:
    Search:
      name: search
      in: query
      description: Texto de búsqueda sin distinguir mayúsculas y minúsculas.
      schema: { type: string, minLength: 1 }
      example: martina
    Page:
      name: page
      in: query
      description: Número de página, comenzando en uno.
      schema: { type: integer, minimum: 1, default: 1 }
      example: 1
    Limit:
      name: limit
      in: query
      description: Cantidad de elementos por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
    FromDateTime:
      name: from
      in: query
      description: Inicio opcional e inclusivo del intervalo.
      schema: { type: string, format: date-time }
      example: "2026-09-01T00:00:00-03:00"
    ToDateTime:
      name: to
      in: query
      description: Fin opcional e inclusivo del intervalo.
      schema: { type: string, format: date-time }
      example: "2026-09-30T23:59:59-03:00"
    RequiredFromDateTime:
      name: from
      in: query
      required: true
      description: Inicio inclusivo del período.
      schema: { type: string, format: date-time }
      example: "2026-09-01T00:00:00-03:00"
    RequiredToDateTime:
      name: to
      in: query
      required: true
      description: Fin inclusivo del período.
      schema: { type: string, format: date-time }
      example: "2026-09-30T23:59:59-03:00"
    ActiveFilter:
      name: isActive
      in: query
      description: Filtro administrativo por estado activo.
      schema: { type: boolean }
      example: true
    ReadFilter:
      name: isRead
      in: query
      description: Filtra notificaciones leídas o no leídas.
      schema: { type: boolean }
      example: false
    UserRoleFilter:
      name: role
      in: query
      schema: { $ref: "#/components/schemas/UserRole" }
    UserStatusFilter:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/UserStatus" }
    MembershipStatusFilter:
      name: membershipStatus
      in: query
      schema: { $ref: "#/components/schemas/MembershipStatus" }
    PaymentStatusFilter:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/PaymentStatus" }
    MedicalCertificateStatusFilter:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/MedicalCertificateStatus" }
    AccessResultFilter:
      name: result
      in: query
      schema: { $ref: "#/components/schemas/AccessResult" }
    EventStatusFilter:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/EventStatus" }
    EventTimingFilter:
      name: timing
      in: query
      description: Estado temporal calculado a partir de `startsAt`.
      schema: { $ref: "#/components/schemas/EventTiming" }
    PublicationAudienceFilter:
      name: audience
      in: query
      schema: { $ref: "#/components/schemas/PublicationAudience" }
    PublicationStatusFilter:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/PublicationStatus" }
    NotificationTypeFilter:
      name: type
      in: query
      schema: { $ref: "#/components/schemas/NotificationType" }
    WeekStartsOnFilter:
      name: weekStartsOn
      in: query
      description: Fecha acordada como inicio de la semana.
      schema: { type: string, format: date }
      example: "2026-09-14"
    MemberIdFilter:
      name: memberId
      in: query
      schema: { type: string, format: uuid }
      example: 11111111-1111-4111-8111-111111111111
    UserIdFilter:
      name: userId
      in: query
      schema: { type: string, format: uuid }
      example: 11111111-1111-4111-8111-111111111111
    BranchIdFilter:
      name: branchId
      in: query
      schema: { type: string, format: uuid }
      example: 22222222-2222-4222-8222-222222222222
    DocumentNumberFilter:
      name: documentNumber
      in: query
      schema: { type: string, minLength: 1 }
      example: "40111222"
    PaymentMethodFilter:
      name: method
      in: query
      description: Medio de pago como texto hasta que M-Team confirme un catálogo.
      schema: { type: string, minLength: 1 }
      example: transferencia
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 11111111-1111-4111-8111-111111111111
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 11111111-1111-4111-8111-111111111111
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 33333333-3333-4333-8333-333333333333
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 44444444-4444-4444-8444-444444444444
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 55555555-5555-4555-8555-555555555555
    AccessPointId:
      name: accessPointId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 66666666-6666-4666-8666-666666666666
    BranchId:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 22222222-2222-4222-8222-222222222222
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 77777777-7777-4777-8777-777777777777
    ClassId:
      name: classId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 88888888-8888-4888-8888-888888888888
    TrainerId:
      name: trainerId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 99999999-9999-4999-8999-999999999999
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
    NewsPostId:
      name: newsPostId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: cccccccc-cccc-4ccc-8ccc-cccccccccccc

  responses:
    ValidationError:
      description: La solicitud no cumple las validaciones.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: VALIDATION_ERROR
            message: Los datos enviados no son válidos
            details:
              fields: { email: [Debe ser un correo válido] }
    Unauthorized:
      description: Falta una credencial válida.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: UNAUTHORIZED, message: Se requiere autenticación, details: null }
    Forbidden:
      description: La identidad no tiene permiso para la operación.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: FORBIDDEN, message: No tenés permiso para esta operación, details: null }
    NotFound:
      description: El recurso solicitado no existe o no es visible para la identidad.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: NOT_FOUND
            message: El recurso solicitado no existe
            details: { method: GET, path: /api/payments/33333333-3333-4333-8333-333333333333 }
    Conflict:
      description: La operación entra en conflicto con el estado o una restricción única.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: CONFLICT, message: El recurso ya existe o cambió de estado, details: null }
    InternalError:
      description: Error inesperado sin exposición de información sensible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: INTERNAL_ERROR, message: Ocurrió un error interno, details: null }

  schemas:
    UserRole:
      type: string
      enum: [MEMBER, TRAINER, ADMIN]
      example: MEMBER
    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      example: ACTIVE
    MembershipStatus:
      type: string
      description: Estado calculado; no se persiste.
      enum: [CURRENT, EXPIRING_SOON, EXPIRED]
      example: CURRENT
    PaymentStatus:
      type: string
      enum: [ACCREDITED, VOIDED]
      example: ACCREDITED
    MedicalCertificateStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
      example: APPROVED
    AccessResult:
      type: string
      enum: [ALLOWED, DENIED]
      example: ALLOWED
    AccessDenialReason:
      type: string
      enum:
        - INVALID_QR
        - INACTIVE_USER
        - INACTIVE_BRANCH
        - INACTIVE_ACCESS_POINT
        - EXPIRED_MEMBERSHIP
        - MEDICAL_CERTIFICATE_REQUIRED
      example: EXPIRED_MEMBERSHIP
    UserAuditAction:
      type: string
      enum: [CREATED, UPDATED, ACTIVATED, DEACTIVATED, PASSWORD_RESET]
      example: UPDATED
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED]
      example: PUBLISHED
    EventTiming:
      type: string
      description: Estado calculado según la fecha actual.
      enum: [UPCOMING, FINISHED]
      example: UPCOMING
    PublicationAudience:
      type: string
      enum: [ALL, MEMBERS, TRAINERS]
      example: ALL
    PublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, INACTIVE]
      example: PUBLISHED
    NotificationType:
      type: string
      enum:
        - MEMBERSHIP_PRICE_CHANGED
        - MEMBERSHIP_EXPIRING
        - MEMBERSHIP_EXPIRED
        - MEDICAL_CERTIFICATE_REVIEWED
        - CLASS_CHANGED
        - EVENT_CANCELLED
        - GENERAL
      example: MEMBERSHIP_EXPIRING
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, environment]
      properties:
        status: { type: string, const: ok }
        environment: { type: string, enum: [development, test, staging, production] }
      example: { status: ok, environment: development }
    OpenApiDocumentResponse:
      type: object
      description: Documento OpenAPI completo; su forma se valida por el estándar.
      required: [openapi, info, paths]
      properties:
        openapi: { type: string }
        info: { type: object }
        paths: { type: object }
      additionalProperties: true
      example:
        openapi: 3.1.0
        info: { title: M-Team API, version: 0.2.0 }
        paths: { /health: { get: { operationId: getHealth } } }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        details:
          description: Contexto seguro del error o null.
      example:
        code: VALIDATION_ERROR
        message: Los datos enviados no son válidos
        details: { fields: { email: [Debe ser un correo válido] } }
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      example: { page: 1, limit: 20, total: 1, totalPages: 1 }
    ActorSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
      example:
        id: dddddddd-dddd-4ddd-8ddd-dddddddddddd
        firstName: Ana
        lastName: Gómez
    BranchSummary:
      type: object
      additionalProperties: false
      required: [id, name, address, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        isActive: { type: boolean }
      example:
        id: 22222222-2222-4222-8222-222222222222
        name: M-Team Centro
        address: Avenida Ejemplo 123, CABA
        isActive: true
    RegisterMemberRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, documentNumber, birthDate, email, phone, password]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        documentNumber: { type: string, minLength: 1 }
        birthDate: { type: string, format: date }
        email: { type: string, format: email }
        phone: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 8, writeOnly: true }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
      example:
        firstName: Martina
        lastName: Pérez
        documentNumber: "40111222"
        birthDate: "1998-04-12"
        email: martina.perez@example.com
        phone: "+54 11 5555-0101"
        password: ClaveFicticia2026
        emergencyContactName: Juan Pérez
        emergencyContactPhone: "+54 11 5555-0102"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
      example: { email: martina.perez@example.com, password: ClaveFicticia2026 }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        user: { $ref: "#/components/schemas/UserResponse" }
      example:
        accessToken: jwt-ficticio-no-valido
        tokenType: Bearer
        user:
          id: 11111111-1111-4111-8111-111111111111
          firstName: Martina
          lastName: Pérez
          documentNumber: "40111222"
          birthDate: "1998-04-12"
          email: martina.perez@example.com
          phone: "+54 11 5555-0101"
          photoUrl: null
          role: MEMBER
          status: ACTIVE
          isPasswordChangeRequired: false
          createdAt: "2026-08-01T10:00:00-03:00"
          updatedAt: "2026-08-01T10:00:00-03:00"
    CurrentIdentityResponse:
      type: object
      additionalProperties: false
      required: [id, role, status, isPasswordChangeRequired]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        isPasswordChangeRequired: { type: boolean }
      example:
        id: 11111111-1111-4111-8111-111111111111
        role: MEMBER
        status: ACTIVE
        isPasswordChangeRequired: false
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, writeOnly: true }
        newPassword: { type: string, format: password, minLength: 8, writeOnly: true }
      example: { currentPassword: ClaveFicticia2026, newPassword: NuevaClaveFicticia2026 }
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - firstName
        - lastName
        - documentNumber
        - birthDate
        - email
        - phone
        - photoUrl
        - role
        - status
        - isPasswordChangeRequired
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        documentNumber: { type: string }
        birthDate: { type: string, format: date }
        email: { type: string, format: email }
        phone: { type: string }
        photoUrl: { type: [string, "null"], format: uri }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        isPasswordChangeRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        id: 11111111-1111-4111-8111-111111111111
        firstName: Martina
        lastName: Pérez
        documentNumber: "40111222"
        birthDate: "1998-04-12"
        email: martina.perez@example.com
        phone: "+54 11 5555-0101"
        photoUrl: null
        role: MEMBER
        status: ACTIVE
        isPasswordChangeRequired: false
        createdAt: "2026-08-01T10:00:00-03:00"
        updatedAt: "2026-09-10T18:30:00-03:00"
    MemberProfileResponse:
      type: object
      additionalProperties: false
      required: [id, emergencyContactName, emergencyContactPhone, membership]
      properties:
        id: { type: string, format: uuid }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        membership: { $ref: "#/components/schemas/MembershipSummaryResponse" }
      example:
        id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
        emergencyContactName: Juan Pérez
        emergencyContactPhone: "+54 11 5555-0102"
