        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /weekly-schedules/{scheduleId}/copies:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      tags: [Weekly Schedules]
      summary: Copiar el cronograma a otra semana
      description: >-
        Exclusivo de administradores autenticados que ya cambiaron su
        contraseña temporal. La fecha de destino debe ser un lunes no pasado;
        la semana de destino no puede existir. La operación copia actividad,
        día, horario, sede y entrenador opcional sin modificar el origen.
      operationId: copyWeeklySchedule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekStartsOn]
              properties:
                weekStartsOn: { type: string, format: date }
      responses:
        "201":
          description: Cronograma semanal copiado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklySchedule" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /scheduled-classes:
    post:
      tags: [Scheduled Classes]
      summary: Crear una clase en un cronograma
      description: >-
        Exclusivo de administradores. Crea automáticamente el cronograma si es la
        primera clase de esa semana. weekStartsOn es el lunes del calendario de
        America/Argentina/Buenos_Aires; startsAt debe tener zona horaria y caer
        entre ese lunes inclusive y el lunes siguiente exclusivo en ese calendario.
        No se crean clases que ya comenzaron. La sede y el entrenador opcional
        deben seguir activos al guardar la clase.
      operationId: createScheduledClass
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduledClassRequest" }
      responses:
        "201":
          description: Clase creada y cronograma semanal asociado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedScheduledClass" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

